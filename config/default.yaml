# OTIS Default Configuration
# Optimization and Transformation Intelligence System

# Global Settings
log_level: "INFO"
enable_telemetry: false
auto_update: true
performance_mode: "auto"  # auto, gaming, productivity, extreme

# Memory Optimization Engine
memory:
  zram_size_percent: 25
  compression_algorithm: "zstd"  # lz4, lzo, zstd, lz4hc
  enable_ksm: true
  ai_prediction: true
  cloud_extension: false
  max_compression_ratio: 5.0
  enable_ballooning: true
  aggressive_mode: false

# GPU Virtualization Engine
gpu:
  enable_llvmpipe: true
  dxvk_async: true
  cloud_rendering: false
  ai_upscaling: true
  software_rendering_threads: 0  # 0 = auto-detect
  vulkan_optimization: true
  directx_translation: true
  frame_prediction: true

# Storage Optimization Engine
storage:
  compression_level: 9
  enable_deduplication: true
  cloud_extension: false
  cache_size_gb: 2
  predictive_caching: true
  context_aware_compression: true
  virtual_storage_pools: true

# AI Optimization Engine
ai:
  enable_prediction: true
  prediction_window_minutes: 5
  learning_rate: 0.001
  model_update_interval: 300  # seconds
  enable_thermal_management: true
  enable_workload_prediction: true
  enable_resource_allocation: true

# Cloud Hybrid Computing
cloud:
  enable_cloud_bursting: false
  enable_edge_computing: true
  cloud_provider: "auto"  # auto, aws, azure, gcp
  max_cloud_cost_per_hour: 1.0
  latency_threshold_ms: 100
  enable_hybrid_processing: true

# Windows Compatibility Layer
windows:
  wine_version: "staging"
  dxvk_version: "latest"
  enable_registry_virtualization: true
  enable_api_emulation: true
  compatibility_mode: "aggressive"  # conservative, balanced, aggressive
  enable_directx_translation: true

# Security Engine
security:
  enable_behavioral_analysis: true
  enable_memory_protection: true
  enable_ai_threat_detection: true
  scan_only_when_idle: true
  zero_impact_mode: true
  threat_detection_sensitivity: "balanced"  # low, balanced, high